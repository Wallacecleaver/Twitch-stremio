<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{LOGIN}} en direct · {{NAME}}</title>
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/lecteur.css?v={{REVISION}}">
  <script defer src="/lecteur-hls.js?v={{HLS_VERSION}}"></script>
  <script defer src="/lecteur.js?v={{REVISION}}"></script>
</head>
<body>
  <main>
    <header>
      <img src="/logo.png?v={{LOGO_VERSION}}" width="40" height="40" alt="">
      <div>
        <p class="brand">{{NAME}}</p>
        <h1 id="channel">{{LOGIN}}</h1>
      </div>
      <a class="twitch-link" href="https://www.twitch.tv/{{LOGIN}}" target="_blank" rel="noopener noreferrer">Ouvrir sur Twitch ↗</a>
    </header>
    <section class="player" id="player" aria-label="Lecteur du direct" data-sources="{{SOURCES}}">
      <div class="screen" id="screen">
        <video id="video" playsinline disablepictureinpicture></video>
        <div class="screen-message" id="screen-message">
          <p id="message" role="status">Chargement du direct…</p>
          <button id="action" type="button" hidden></button>
        </div>
        <p class="audio-only" id="audio-only" hidden>Audio seul</p>
      </div>
      <div class="controls">
        <div class="timeline-label">
          <span id="position">Tampon en cours de chargement</span>
          <button class="live" id="live" type="button" disabled>Revenir au direct</button>
        </div>
        <input id="timeline" type="range" min="0" max="1" value="0" step="1" aria-label="Position dans le direct" disabled>
        <div class="toolbar">
          <div class="button-group">
            <button id="play" type="button" disabled>Lecture</button>
            <button id="back" type="button" aria-label="Reculer de 10 secondes" disabled>−10 s</button>
            <button id="forward" type="button" aria-label="Avancer de 10 secondes" disabled>+10 s</button>
            <button id="mute" type="button">Couper le son</button>
          </div>
          <div class="button-group">
            <label for="quality">Qualité</label>
            <select id="quality" disabled><option value="0">Auto</option></select>
            <button id="fullscreen" type="button" hidden>Plein écran</button>
          </div>
        </div>
      </div>
    </section>
    <noscript>Active JavaScript pour utiliser le lecteur.</noscript>
  </main>
</body>
</html>
