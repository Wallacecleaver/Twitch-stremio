<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{NAME}} · Configuration</title>
<meta name="theme-color" content="{{COLOR}}">
<link rel="icon" type="image/png" href="/logo.png?v={{V}}">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
:root{--bg:#07070a;--bg3:rgba(20,20,26,.62);--el:rgba(255,255,255,.045);--el2:rgba(255,255,255,.075);--hv:#2a2a31;--bs:rgba(255,255,255,.07);--bd:rgba(255,255,255,.12);--bx:rgba(255,255,255,.24);--t:#f6f6f8;--t2:#a8a8b3;--t3:#74747f;--a:#9d5cff;--a2:#38bdf8;--ah:#7c3aed;--as:rgba(157,92,255,.15);--ok:#34d399;--oks:rgba(52,211,153,.12);--ko:#fb7185;--kos:rgba(251,113,133,.12);--r:14px;--rl:26px;--mono:'JetBrains Mono',Consolas,monospace;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
html{font-size:15px;-webkit-font-smoothing:antialiased;color-scheme:dark;scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,'Segoe UI',sans-serif;background:radial-gradient(900px 420px at 50% -120px,rgba(145,71,255,.2),transparent 70%) no-repeat,var(--bg);color:var(--t);min-height:100vh;line-height:1.6;overflow-x:hidden}
.wrap{position:relative;z-index:1;max-width:740px;margin:0 auto;padding:30px 18px 70px}
.brand{display:flex;align-items:center;gap:12px;font-family:'Space Grotesk','Inter',sans-serif;font-weight:700;font-size:1.12rem;letter-spacing:-.01em;margin-bottom:26px;animation:up .8s var(--ease) both}
.brand img{width:34px;height:34px;border-radius:10px;box-shadow:0 6px 18px -6px var(--a)}
.badge{margin-left:auto;font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:#d9c4ff;background:var(--as);border:1px solid rgba(157,92,255,.3);padding:4px 12px;border-radius:99px}
.tabs{position:relative;display:flex;padding:5px;background:rgba(255,255,255,.04);border:1px solid var(--bs);border-radius:99px;margin:0 auto 24px;width:fit-content;animation:up .8s .05s var(--ease) both}.tabs.off{display:none}
.ind{position:absolute;top:5px;left:0;height:calc(100% - 10px);width:0;border-radius:99px;background:linear-gradient(135deg,color-mix(in srgb,var(--a),#fff 25%),var(--a) 55%,var(--ah));box-shadow:0 8px 26px -8px var(--a),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .55s var(--spring),width .45s var(--ease)}
.tab{position:relative;z-index:1;font:inherit;font-weight:600;font-size:.88rem;color:var(--t2);background:none;border:0;border-radius:99px;padding:10px 22px;cursor:pointer;transition:color .3s}.tab:hover{color:var(--t)}.tab.on{color:#fff}
.steps{position:relative;display:flex;margin-bottom:24px;animation:up .8s .1s var(--ease) both;transition:opacity .4s,max-height .5s var(--ease);max-height:120px}.steps.off{opacity:0;pointer-events:none;max-height:0;margin:0;overflow:hidden}
.trk{position:absolute;top:16px;left:10%;right:10%;height:3px;background:rgba(255,255,255,.08);border-radius:3px}
.fill{position:absolute;top:0;left:0;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--a2));border-radius:3px;box-shadow:0 0 14px var(--a);transition:width .8s var(--ease)}
.fill::after{content:'';position:absolute;right:-4px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:#fff;box-shadow:0 0 12px 3px var(--a2)}
.sp{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;background:none;border:0;color:var(--t3);font:inherit;font-size:.72rem;font-weight:500;transition:color .3s}
.sp i{position:relative;width:34px;height:34px;border-radius:50%;background:#14141a;border:2px solid var(--bd);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:.82rem;color:var(--t2);transition:all .5s var(--spring)}
.sp:hover i{border-color:var(--bx);transform:scale(1.1)}
.sp.done i{background:linear-gradient(135deg,var(--a),var(--ah));border-color:transparent;color:#fff;box-shadow:0 0 18px -2px var(--a)}
.sp.cur i{background:#14141a;border-color:var(--a);color:#fff;transform:scale(1.15);box-shadow:0 0 0 5px var(--as),0 0 24px var(--a)}
.sp.cur,.sp.done{color:var(--t)}
@media(max-width:520px){.sp span{display:none}}
.stage{position:relative;background:#121217;border:1px solid var(--bd);border-radius:var(--rl);overflow:hidden;box-shadow:0 20px 50px -24px rgba(0,0,0,.8);transition:height .45s var(--ease);animation:up .6s .12s var(--ease) both}
.spot{position:relative}
.pane{padding:30px}@media(max-width:520px){.pane{padding:20px}}
.pane.in-l{animation:inl .5s var(--ease) both}.pane.in-r{animation:inr .5s var(--ease) both}.pane.x-l{animation:xl .18s ease-in both}.pane.x-r{animation:xr .18s ease-in both}.pane.fade{animation:up .55s var(--ease) both}
@keyframes inl{from{opacity:0;transform:translate3d(32px,0,0)}to{opacity:1;transform:none}}
@keyframes inr{from{opacity:0;transform:translate3d(-32px,0,0)}to{opacity:1;transform:none}}
@keyframes xl{to{opacity:0;transform:translate3d(-24px,0,0)}}@keyframes xr{to{opacity:0;transform:translate3d(24px,0,0)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--a2);margin-bottom:10px}.eyebrow::before{content:'';width:22px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--a2),transparent)}
.pane h1{font-family:'Space Grotesk','Inter',sans-serif;font-size:1.75rem;line-height:1.2;letter-spacing:-.025em;margin-bottom:6px;color:#fff}
.sub{color:var(--t2);margin-bottom:24px}
.grid{display:grid;gap:18px}.grid>*{animation:up .5s var(--ease) both}.grid>*:nth-child(1){animation-delay:.08s}.grid>*:nth-child(2){animation-delay:.14s}.grid>*:nth-child(3){animation-delay:.2s}.grid>*:nth-child(4){animation-delay:.26s}.grid>*:nth-child(5){animation-delay:.32s}.grid>*:nth-child(6){animation-delay:.38s}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:600px){.two{grid-template-columns:1fr}}
.row{display:grid;gap:7px}.lab{font-size:.84rem;font-weight:600;letter-spacing:.01em}.hint{font-size:.8rem;color:var(--t3);font-weight:400;line-height:1.55}.hint b{color:var(--t2)}
.err{font-size:.8rem;color:var(--ko);max-height:0;overflow:hidden;opacity:0;transform:translateY(-4px);transition:all .35s var(--ease)}.err.show{max-height:44px;opacity:1;transform:none}
.fld{position:relative}
input[type=text],input[type=password],select{width:100%;font:inherit;color:var(--t);background:var(--el);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;outline:0;transition:border-color .25s,box-shadow .3s,background .25s,transform .3s var(--ease)}
input::placeholder{color:#5d5d68}
input:hover,select:hover{border-color:var(--bx)}input:focus,select:focus{border-color:var(--a);box-shadow:0 0 0 3px var(--as);background:rgba(157,92,255,.06)}
input.bad{border-color:var(--ko);box-shadow:0 0 0 4px var(--kos);animation:shake .45s}@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.fld input{padding-right:48px}.eye{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:none;color:var(--t3);cursor:pointer;border-radius:10px;display:grid;place-items:center;transition:.25s}.eye:hover{color:var(--t);background:var(--el2)}
.meter{display:flex;gap:5px;height:4px}.meter i{flex:1;background:rgba(255,255,255,.08);border-radius:4px;transition:background .4s,box-shadow .4s}.meter.s1 i:nth-child(1){background:#fb7185;box-shadow:0 0 8px #fb7185}.meter.s2 i:nth-child(-n+2){background:#fbbf24;box-shadow:0 0 8px #fbbf24}.meter.s3 i:nth-child(-n+3){background:#a3e635;box-shadow:0 0 8px #a3e635}.meter.s4 i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.prev{display:grid;gap:8px;margin-top:6px}.pv{display:grid;grid-template-columns:84px 1fr;gap:14px;background:var(--el);border:1px solid var(--bs);border-radius:12px;padding:11px 14px;font-size:.82rem;line-height:1.5}.pv b{color:var(--t);font-weight:600;white-space:pre-line}.pv span{color:var(--t2);white-space:pre-line}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:9px}.seg button{position:relative;font:inherit;font-weight:600;font-size:.9rem;color:var(--t2);background:var(--el);border:1px solid var(--bd);border-radius:var(--r);padding:13px 8px;cursor:pointer;transition:all .35s var(--ease);overflow:hidden}
.seg button:hover{border-color:var(--bx);color:var(--t);transform:translateY(-2px)}.seg button:active{transform:scale(.96)}.seg button.on{background:linear-gradient(160deg,rgba(157,92,255,.28),rgba(157,92,255,.1));border-color:var(--a);color:#fff;box-shadow:0 10px 26px -10px var(--a),inset 0 1px 0 rgba(255,255,255,.15)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 18px;background:var(--el);border:1px solid var(--bs);border-radius:var(--r);cursor:pointer;transition:all .35s var(--ease);position:relative;overflow:hidden}.tg:hover{border-color:var(--bd);transform:translateY(-2px);background:var(--el2)}.tg:active{transform:scale(.99)}
.tg b{display:block;font-size:.93rem;margin-bottom:2px}.tg span{font-size:.8rem;color:var(--t3);line-height:1.5;display:block}
.sw{position:relative;flex:none;width:50px;height:30px;background:rgba(255,255,255,.1);border-radius:99px;border:0;transition:background .4s var(--ease),box-shadow .4s;pointer-events:none}.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.45);transition:transform .5s var(--spring)}.sw.on{background:linear-gradient(135deg,var(--a),var(--ah));box-shadow:0 0 18px -2px var(--a)}.sw.on::after{transform:translateX(20px)}
.btn{position:relative;font:inherit;font-weight:600;font-size:.92rem;border:1px solid var(--bd);background:var(--el);color:var(--t);border-radius:var(--r);padding:13px 22px;cursor:pointer;transition:all .35s var(--ease);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;overflow:hidden}
.btn:hover{border-color:var(--bx);background:var(--el2);transform:translateY(-2px)}.btn:active{transform:scale(.97)}
.btn.pr{background:linear-gradient(135deg,color-mix(in srgb,var(--a),#fff 22%),var(--ah));border-color:transparent;box-shadow:0 8px 20px -10px var(--a)}.btn.pr:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}.btn.dg{color:#fda4af}.btn.big{padding:16px 30px;font-size:1rem}
.sp2{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:28px;padding-top:22px;border-top:1px solid var(--bs)}
.note{padding:13px 16px;border-radius:var(--r);font-size:.85rem;border:1px solid rgba(157,92,255,.3);background:var(--as);color:#e2d4ff;transition:all .4s var(--ease)}.note.ok{background:var(--oks);border-color:rgba(52,211,153,.35);color:#86efac}.note.w{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3);color:#fcd34d}
.url{display:flex;gap:8px}.url input{font-family:var(--mono);font-size:.76rem}
.help{background:var(--el);border:1px solid var(--bs);border-radius:var(--r);padding:2px 18px;transition:border-color .3s}.help:hover{border-color:var(--bd)}.help summary{cursor:pointer;padding:13px 0;font-weight:600;font-size:.88rem}.help[open] ol{animation:up .45s var(--ease)}.help ol{padding:0 0 14px 20px;color:var(--t2);font-size:.85rem;display:grid;gap:6px}
.sum{border:1px solid var(--bs);border-radius:var(--r);overflow:hidden;background:var(--el)}.sum div{display:flex;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--bs);font-size:.88rem;animation:up .6s var(--ease) both}.sum div:last-child{border:0}.sum span{color:var(--t3)}.sum b{text-align:right}
.done{text-align:center;display:grid;gap:15px;justify-items:center}
.ck{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle,rgba(52,211,153,.25),rgba(52,211,153,.06));border:1px solid rgba(52,211,153,.4);display:grid;place-items:center;box-shadow:0 0 50px -6px var(--ok);animation:pop .8s var(--spring) both}.ck svg{width:42px;height:42px;stroke:var(--ok);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .6s .4s ease forwards}
@keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}@keyframes draw{to{stroke-dashoffset:0}}
.lock{display:grid;gap:18px;justify-items:center;text-align:center}.lock .ico{width:72px;height:72px;border-radius:50%;background:var(--as);border:1px solid rgba(157,92,255,.35);display:grid;place-items:center;box-shadow:0 0 40px -8px var(--a);animation:pop .7s var(--spring) both}.lock .ico svg{width:32px;height:32px;stroke:var(--a);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.lock .row{width:100%;text-align:left}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.hero{display:grid;gap:16px;margin-bottom:24px}.hero p{color:var(--t2)}.hero h1{margin-bottom:0}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}@media(max-width:600px){.feat{grid-template-columns:1fr}}
.feat div{position:relative;overflow:hidden;background:var(--el);border:1px solid var(--bs);border-radius:var(--r);padding:14px 16px;font-size:.82rem;color:var(--t2);transition:all .4s var(--ease);animation:up .7s var(--ease) both}.feat div:nth-child(1){animation-delay:.1s}.feat div:nth-child(2){animation-delay:.18s}.feat div:nth-child(3){animation-delay:.26s}.feat div:hover{transform:translateY(-4px);border-color:rgba(157,92,255,.4)}.feat b{display:block;color:var(--t);font-size:.9rem;margin-bottom:3px}
.why{font-size:.82rem;color:var(--t2);background:linear-gradient(90deg,rgba(157,92,255,.12),rgba(157,92,255,.02));border-left:3px solid var(--a);border-radius:0 var(--r) var(--r) 0;padding:12px 16px;line-height:1.55}.why b{color:var(--t)}
.idbox{display:grid;gap:7px;width:100%;text-align:left;background:linear-gradient(135deg,rgba(157,92,255,.18),rgba(56,189,248,.07));border:1px solid rgba(157,92,255,.35);border-radius:var(--r);padding:16px}.idbox .lab{color:#e2d4ff}.idbox .url input{font-size:.92rem;letter-spacing:.03em}
/* Écran de vérification : tableau de bord « HUD » */
.vf{position:relative;margin:18px 0 4px;padding:22px;border-radius:22px;border:1px solid rgba(157,92,255,.3);background:radial-gradient(120% 80% at 0% 0%,rgba(157,92,255,.16),transparent 55%),radial-gradient(100% 70% at 100% 100%,rgba(56,189,248,.11),transparent 55%),rgba(10,10,16,.74);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;display:grid;gap:20px;box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 24px 70px -24px rgba(124,58,237,.55);transition:border-color .5s,box-shadow .5s}
.vf::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 15%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 0%,#000 15%,transparent 75%)}
.vf.scan::after{content:"";position:absolute;left:0;right:0;top:0;height:110px;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(56,189,248,.13),transparent);animation:vscan 2.8s linear infinite}
@keyframes vscan{from{transform:translateY(-120px)}to{transform:translateY(560px)}}
.vf.fin{border-color:rgba(52,211,153,.4);box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 24px 70px -24px rgba(52,211,153,.5)}
.vf.bad{border-color:rgba(251,113,133,.45);box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 24px 70px -24px rgba(251,113,133,.5)}
.hc{position:absolute;width:14px;height:14px;border:2px solid var(--a2);opacity:.75;pointer-events:none;transition:border-color .5s}
.hc.a{top:9px;left:9px;border-right:0;border-bottom:0;border-top-left-radius:6px}.hc.b{top:9px;right:9px;border-left:0;border-bottom:0;border-top-right-radius:6px}
.hc.c{bottom:9px;left:9px;border-right:0;border-top:0;border-bottom-left-radius:6px}.hc.d{bottom:9px;right:9px;border-left:0;border-top:0;border-bottom-right-radius:6px}
.vf.fin .hc{border-color:var(--ok)}.vf.bad .hc{border-color:var(--ko)}
.vtop{position:relative;display:flex;align-items:center;gap:20px}
.vring{position:relative;flex:none;width:96px;height:96px}
.vring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.vring circle{fill:none;stroke-width:7;stroke-linecap:round}
.vring .rt{stroke:rgba(255,255,255,.08)}
.vring .rp{stroke:url(#vgr);stroke-dasharray:100;transition:stroke-dashoffset .8s var(--ease),stroke .5s;filter:drop-shadow(0 0 7px rgba(157,92,255,.75))}
.vf.fin .rp{stroke:var(--ok);filter:drop-shadow(0 0 7px rgba(52,211,153,.7))}.vf.bad .rp{stroke:var(--ko);filter:drop-shadow(0 0 7px rgba(251,113,133,.7))}
.vring b{position:absolute;inset:0;display:grid;place-items:center;font:700 1.3rem 'Space Grotesk',sans-serif;letter-spacing:-.01em}
.vinfo{min-width:0;display:grid;gap:5px}
.vkick{font:600 .66rem 'Space Grotesk',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--a2)}
.vinfo strong{font:700 1.2rem 'Space Grotesk',sans-serif;letter-spacing:-.01em}
.vlog{font:500 .76rem ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vlog::after{content:"▍";margin-left:2px;color:var(--a2);animation:vblink 1s steps(1) infinite}
@keyframes vblink{50%{opacity:0}}
.vf.fin .vlog::after,.vf.bad .vlog::after{display:none}
.vlist{position:relative;display:grid;gap:8px}
.vr{position:relative;display:flex;align-items:center;gap:13px;padding:12px 14px 12px 12px;border:1px solid var(--bs);border-radius:14px;background:rgba(255,255,255,.03);overflow:hidden;transition:border-color .35s,background .35s,box-shadow .35s,opacity .35s;animation:up .5s var(--ease) both}
.vr>*{position:relative}
.vr .ix{flex:none;width:20px;font:600 .66rem 'Space Grotesk',monospace;letter-spacing:.06em;color:var(--t3)}
.vr .ic{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:.82rem;font-weight:700;background:rgba(255,255,255,.06);border:1px solid var(--bs);color:var(--t3);transition:.3s}
.vr .tx{flex:1;min-width:0}.vr .tx b{display:block;font-size:.9rem}.vr .tx span{display:block;color:var(--t2);font-size:.76rem;overflow-wrap:anywhere}
.vr .tg2{flex:none;padding:3px 9px;border:1px solid currentColor;border-radius:99px;font:700 .58rem 'Space Grotesk',monospace;letter-spacing:.12em;color:var(--t3)}.vr .tg2:empty{display:none}
.vr.run{border-color:rgba(56,189,248,.45);background:rgba(56,189,248,.06);box-shadow:0 0 22px -10px rgba(56,189,248,.8)}
.vr.run::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(56,189,248,.16) 50%,transparent 70%);transform:translateX(-100%);animation:vsweep 1.5s ease-in-out infinite}
@keyframes vsweep{to{transform:translateX(100%)}}
.vr.run .ic{background:rgba(56,189,248,.1);border-color:rgba(56,189,248,.4)}.vr.run .tg2{color:var(--a2)}
.vr.run .sp2{border-color:rgba(56,189,248,.3);border-top-color:var(--a2)}
.vr.ok{border-color:rgba(52,211,153,.35);background:linear-gradient(90deg,rgba(52,211,153,.12),rgba(52,211,153,.03));box-shadow:0 0 20px -10px rgba(52,211,153,.8)}.vr.ok .ic{background:var(--ok);border-color:var(--ok);color:#052e1d;box-shadow:0 0 14px rgba(52,211,153,.55)}.vr.ok .tg2{color:var(--ok)}
.vr.warn{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.07)}.vr.warn .ic{background:#fbbf24;border-color:#fbbf24;color:#3b2a00;box-shadow:0 0 14px rgba(251,191,36,.5)}.vr.warn .tg2{color:#fbbf24}
.vr.ko{border-color:rgba(251,113,133,.45);background:var(--kos)}.vr.ko .ic{background:var(--ko);border-color:var(--ko);color:#3a0a12;box-shadow:0 0 14px rgba(251,113,133,.55)}.vr.ko .tg2{color:var(--ko)}
.vr.wait{opacity:.5}
@media(max-width:520px){.vtop{gap:14px}.vring{width:78px;height:78px}.vring b{font-size:1.1rem}.vr .ix{display:none}}
@media(prefers-reduced-motion:reduce){.vf.scan::after,.vr.run::before,.vlog::after{animation:none}}
ol.how{text-align:left;color:var(--t2);font-size:.86rem;padding-left:20px;display:grid;gap:5px;width:100%}ol.how b{color:var(--t)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px) scale(.94);background:rgba(28,28,36,.9);border:1px solid var(--bx);border-radius:var(--r);padding:12px 22px;opacity:0;pointer-events:none;transition:all .45s var(--spring);z-index:99;font-size:.9rem;box-shadow:0 14px 40px rgba(0,0,0,.55)}.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
footer{position:relative;z-index:1;display:grid;gap:8px;justify-items:start;margin-top:26px;font-size:.78rem;color:var(--t3);animation:up .6s .25s var(--ease) both}
.credit{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;background:var(--el);border:1px solid var(--bs);border-radius:99px;color:var(--t2)}.credit img{border-radius:5px}.credit b{color:var(--t)}
.lnk{color:var(--a);cursor:pointer;text-decoration:none;background:none;border:0;font:inherit;text-align:left;transition:.2s}.lnk:hover{color:#c4a1ff;text-decoration:underline}
:focus-visible{outline:2px solid var(--a);outline-offset:3px;border-radius:8px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media(max-width:520px){.url{flex-wrap:wrap}.url input{flex:1 1 100%;min-width:0}.url .btn{flex:1}.idbox .url input{font-size:.85rem;letter-spacing:0}}
</style>
<style id="accent">{{ACCENT}}</style>
</head>
<body>
<div class="wrap">
<div class="brand"><img src="/logo.png?v={{V}}" alt="" width="34" height="34">{{NAME}}<span class="badge" id="mode">Configuration</span></div>
<div class="note w" id="banner" hidden style="margin-bottom:18px"></div>
<div class="tabs" id="tabs"><i class="ind" id="ind"></i><button class="tab on" data-tab="create">Créer un profil</button><button class="tab" data-tab="login">Se connecter</button></div>
<div class="steps off" id="steps"></div>
<div class="stage" id="stage"></div>
<footer><div id="foot"></div><div class="credit"><img src="/logo.png?v={{V}}" alt="" width="16" height="16"><span>{{CREDIT}}</span></div></footer>
</div>
<div class="toast" id="toast"></div>
<script>
const SITE={{SITE}};
const $=s=>document.querySelector(s),wait=ms=>new Promise(r=>setTimeout(r,ms));
const CAPS=[[0,'Maximum'],[1440,'1440p'],[1080,'1080p'],[720,'720p'],[480,'480p'],[360,'360p']];
const STEPS=['Profil','Qualité','Compte','Affichage','Options','Terminer'];
const EYE='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
const st={pseudo:'',device:'',cap:0,fps60:true,relay:true,hevc:false,tok:'',acct:'',fixed:3,audio:false,pc:false,fmt:'classique'};
Object.assign(st,SITE.def);
let code='',step=0,id='',fresh=false,persistent=true,result=null,busy=false,legacy=false,nopw=true,curPw='',newPw='',newPw2='',locked=false,welcome=false,swapping=false,known=null;
const clean=p=>String(p||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9_]/g,'').slice(0,20);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const b64=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)};
const opts=()=>({cap:st.cap,fps60:st.fps60,relay:st.relay,hevc:st.hevc,tok:st.tok,fixed:st.fixed,audio:st.audio,pc:st.pc,fmt:st.fmt,device:st.device});
const api=(u,b)=>fetch(u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{}).then(r=>r.json());
const sw=(k,t,d)=>'<div class="tg spot" data-t="'+k+'" role="switch" tabindex="0" aria-checked="'+!!st[k]+'" aria-label="'+t+'"><div><b>'+t+'</b><span>'+d+'</span></div><button class="sw'+(st[k]?' on':'')+'" tabindex="-1" aria-hidden="true"></button></div>';
const pwField=(i,ph)=>'<div class="fld"><input type="password" id="'+i+'" placeholder="'+ph+'" autocomplete="new-password" spellcheck="false"><button class="eye" type="button" data-eye="'+i+'" aria-label="Afficher">'+EYE+'</button></div>';
const strength=p=>{let s=0;if(p.length>=6)s++;if(p.length>=10)s++;if(/[A-Z]/.test(p)&&/[a-z]/.test(p))s++;if(/\d/.test(p)&&/[^A-Za-z0-9]/.test(p)||p.length>=14)s++;return p?Math.max(1,s):0};
const needPw=()=>!id||nopw||fresh;

function steps(){
 const el=$('#steps');
 if(!el.firstElementChild)el.innerHTML='<div class="trk"><div class="fill" id="fill"></div></div>'+STEPS.map((n,i)=>'<button class="sp" data-s="'+i+'"><i></i><span>'+n+'</span></button>').join('');
 el.querySelectorAll('.sp').forEach((b,i)=>{b.className='sp'+(i<step?' done':'')+(i===step?' cur':'');b.firstElementChild.textContent=i<step?'✓':i+1});
 $('#fill').style.width=(step/5*100)+'%';
}
function body(){
 const edit=!!id&&!fresh;let h='';
 const idRow=id?'<div class="row"><span class="lab">Identifiant du profil</span><div class="url"><input type="text" id="idv" readonly value="'+esc(id)+'"><button class="btn" id="copyid">Copier</button></div><span class="hint">C\'est le code unique de ton profil. Avec ton mot de passe, il te permet de te reconnecter ici (onglet « Se connecter »).</span></div>':'';
 if(step===0){
  h=(edit?'<h1>Modifier ma configuration</h1><p class="sub">Change ce que tu veux puis enregistre. <b>Rien à réinstaller</b> : ton addon dans Stremio est mis à jour tout seul.</p>'
   :'<h1>Ton profil</h1><p class="sub">Choisis un pseudo et un mot de passe. Tu pourras revenir modifier tes réglages quand tu veux, sans réinstaller.</p>'+(legacy?'<div class="why" style="margin-bottom:18px"><b>Ancien lien reconnu :</b> tes réglages ont été repris. Il te reste à choisir un mot de passe pour créer ton nouveau profil.</div>':''))
  +'<div class="grid">'
  +'<div class="row"><label class="lab" for="pseudo">Ton pseudo</label><input type="text" id="pseudo" maxlength="20" placeholder="ex : christophe" autocomplete="off" spellcheck="false" value="'+esc(st.pseudo)+'"><span class="err" id="e-pseudo">Choisis un pseudo de 2 caractères minimum.</span><span class="hint"><b>À quoi il sert ?</b> C\'est le nom de ton profil : il apparaît dans Stremio (« Twitch · '+esc(st.pseudo||'pseudo')+' ») et permet à l\'administrateur de retrouver tes lectures s\'il y a un souci. Ce n\'est <b>pas</b> un identifiant de connexion : mets ce que tu veux (2 à 20 lettres, chiffres ou _).</span></div>'
  +'<div class="row"><label class="lab" for="device">Appareil <span class="hint">(facultatif)</span></label><input type="text" id="device" maxlength="24" placeholder="ex : PC, TV salon, téléphone" value="'+esc(st.device)+'"><span class="hint">Le nom de l\'appareil où tu vas installer l\'addon. Pratique si tu fais un profil par appareil : on voit tout de suite lequel pose problème.</span></div>'
  +(edit?idRow:'')
  +'<div class="row"><label class="lab" for="pw1">'+(needPw()?'Mot de passe':'Nouveau mot de passe <span class="hint">(laisse vide pour garder l\'actuel)</span>')+'</label>'+pwField('pw1',needPw()?'6 caractères minimum':'Nouveau mot de passe')+'<div class="meter" id="meter"><i></i><i></i><i></i><i></i></div><span class="err" id="e-pw1">6 caractères minimum.</span>'+(needPw()?'<span class="hint"><b>Pourquoi un mot de passe ?</b> Il protège ton profil : sans lui, personne ne peut modifier tes réglages ni utiliser ton compte Twitch lié. Tu le retapes quand tu te reconnectes. ⚠ Il ne peut pas être récupéré : note-le bien.</span>':'')+'</div>'
  +(needPw()?'<div class="row"><label class="lab" for="pw2">Confirme le mot de passe</label>'+pwField('pw2','Retape-le')+'<span class="err" id="e-pw2">Les deux mots de passe ne correspondent pas.</span><span class="hint">Pour être sûr qu\'il n\'y a pas de faute de frappe.</span></div>':'')
  +(!id&&SITE.needCode?'<div class="row"><label class="lab" for="code">Code d\'invitation</label><input type="text" id="code" maxlength="40" autocomplete="off" spellcheck="false" value="'+esc(code)+'"><span class="err" id="e-code">Code requis.</span><span class="hint"><b>Pourquoi ?</b> La création de profil est réservée aux personnes invitées. Demande le code à l\'administrateur.</span></div>':'')
  +'</div>';
 }
 if(step===1)h='<h1>Qualité de lecture</h1><p class="sub">Ces réglages décident de l\'image que Stremio reçoit : plus c\'est haut, plus c\'est beau, mais plus ta connexion et ton appareil doivent suivre.</p><div class="grid"><div class="row"><span class="lab">Qualité maximale</span><div class="seg" id="cap">'+CAPS.map(([v,l])=>'<button data-v="'+v+'" aria-pressed="'+(st.cap===v)+'" class="'+(st.cap===v?'on':'')+'">'+l+'</button>').join('')+'</div><span class="hint">C\'est un plafond : l\'addon ne proposera jamais mieux. « Maximum » = la meilleure qualité disponible. Si ça saccade ou si ta connexion est lente, descends à 720p ou 480p.</span></div>'
  +sw('fps60','Autoriser le 60 images/s','Le 60 i/s rend les mouvements plus fluides (jeux, sport) mais pèse plus lourd. Coupe-le sur un vieux PC ou une connexion faible : tu auras du 30 i/s, plus léger.')
  +'<div class="row"><label class="lab" for="fixed">Qualités fixes proposées</label><select id="fixed">'+[0,1,2,3,4,5,6].map(n=>'<option value="'+n+'"'+(st.fixed===n?' selected':'')+'>'+(n===0?'Aucune (automatique seul)':n+' qualité'+(n>1?'s':''))+'</option>').join('')+'</select><span class="hint">Dans Stremio, chaque chaîne affiche plusieurs « sources ». La source <b>« Twitch »</b> adapte la qualité toute seule. Ici, tu choisis combien de sources à <b>qualité fixe</b> (1080p, 720p…) s\'ajoutent, pour forcer une qualité précise.</span></div></div>';
 if(step===2)h='<h1>Compte Twitch <span class="hint">· facultatif</span></h1><p class="sub">Tu peux passer cette étape. Elle ne sert que si tu veux le <b>1440p</b>.</p><div class="grid">'
  +'<div class="why"><b>Pourquoi lier un compte ?</b> Twitch n\'envoie le 1440p qu\'aux personnes connectées. En liant ton compte, l\'addon demande le flux à Twitch comme si c\'était toi. Le compte sert <b>uniquement</b> à demander la vidéo (rien n\'est posté, suivi ou modifié).</div>'
  +'<div class="note'+(st.tok?' ok':'')+'" id="acctNote"></div>'
  +'<div class="url"><input type="password" id="tokIn" placeholder="Valeur du cookie auth-token" autocomplete="off" spellcheck="false"><button class="btn pr" id="tokBtn">Lier</button><button class="btn dg" id="tokDel"'+(st.tok?'':' hidden')+'>Retirer</button></div>'
  +'<details class="help"><summary>Où trouver mon auth-token ?</summary><ol><li>Sur Chrome ou Brave, ouvre twitch.tv et connecte-toi.</li><li>Appuie sur F12, puis ouvre l\'onglet « Application ».</li><li>À gauche : Cookies → https://www.twitch.tv.</li><li>Copie la valeur de la ligne <b>auth-token</b> et colle-la ci-dessus.</li></ol></details>'
  +sw('hevc','Autoriser le 1440p (HEVC / AV1)','Demande à Twitch les qualités au-delà du 1080p. Il faut un compte lié, une chaîne qui diffuse en 1440p et un lecteur qui sait lire ce format. En cas de souci, coupe-le.')
  +'<span class="hint">🔒 Le jeton est vérifié auprès de Twitch, puis chiffré : il n\'est jamais affiché ni stocké en clair, et reste protégé par ton mot de passe. Il donne accès à ton compte : ne le partage avec personne.</span></div>';
 if(step===3)h='<h1>Affichage des sources</h1><p class="sub">Choisis comment les sources apparaissent dans la liste de Stremio quand tu ouvres un live. Tu pourras changer ça quand tu veux, sans réinstaller.</p><div class="grid">'
  +'<div class="row"><span class="lab">Style</span><div class="seg" id="fmt">'+SITE.fmts.map(f=>'<button data-v="'+f.id+'" aria-pressed="'+(st.fmt===f.id)+'" class="'+(st.fmt===f.id?'on':'')+'">'+esc(f.label)+'</button>').join('')+'</div><span class="hint" id="fmtDesc"></span><div class="prev" id="fmtPrev" aria-label="Aperçu dans Stremio"></div></div>'
  +'<div class="why"><b>Aperçu :</b> les deux cartes ci-dessus montrent la source « Auto » et une source à qualité fixe, comme dans Stremio.</div></div>';
 if(step===4)h='<h1>Options</h1><p class="sub">Réglages avancés. Les valeurs par défaut conviennent à la plupart des gens : change-les seulement si tu as un problème précis.</p><div class="grid">'
  +sw('relay','Relais sans publicité','Twitch insère des pubs selon ta région. Le relais récupère le flux depuis un serveur d\'une autre région où il y en a moins, puis te le renvoie. Si un relais est en panne, l\'addon retombe tout seul sur le flux officiel.')
  +sw('audio','Proposer « Audio seul »','Ajoute une source qui joue uniquement le son, sans la vidéo : pratique pour écouter un live en travaillant, ou pour économiser la connexion.')
  +sw('pc','Mode ordinateur (Stremio PC)','À activer si Stremio sur ton ordinateur charge sans fin ou se fige. L\'addon nettoie les listes de lecture avant de les donner au lecteur du PC. Inutile sur TV et téléphone.')+'</div>';
 if(step===5&&!result){const L=[['Pseudo',st.pseudo||'—'],['Appareil',st.device||'—'],['Qualité max',st.cap?st.cap+'p':'Maximum'],['60 images/s',st.fps60?'Oui':'Non'],['Compte Twitch',st.tok?(st.acct||'Lié'):'Non'],['1440p',st.hevc?'Oui':'Non'],['Relais sans pub',st.relay?'Oui':'Non'],['Mode ordinateur',st.pc?'Oui':'Non'],['Affichage des sources',(SITE.fmts.find(x=>x.id===st.fmt)||{}).label||'Classique'],['Mot de passe',newPw?'Défini':(edit?'Inchangé':'—')]];
  h='<h1>'+(edit?'Tout est bon ?':'Dernière étape')+'</h1><p class="sub">Vérifie ton récapitulatif. Tu peux cliquer sur une étape en haut pour corriger quelque chose.</p><div class="sum">'+L.map((r,i)=>'<div style="animation-delay:'+(i*.04)+'s"><span>'+r[0]+'</span><b>'+esc(r[1])+'</b></div>').join('')+'</div>'
  +(edit?'<div class="why" style="margin-top:16px"><b>Enregistrer</b> met à jour ton addon <b>sans réinstallation</b> : relance simplement la chaîne dans Stremio.</div>':'<div class="why" style="margin-top:16px"><b>Ensuite ?</b> Tu obtiens un <b>lien à installer dans Stremio</b> (une seule fois) et un <b>identifiant</b> pour revenir modifier ton profil.</div>'+(persistent?'':'<div class="note w" style="margin-top:12px">Base de données non configurée : tu auras un lien classique, sans mot de passe, à réinstaller après chaque changement.</div>'))
  ;}
 if(step===5&&result&&verify&&!verify.ok)return verifyHtml();
 if(step===5&&result)h='<div class="done"><div class="ck"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div><h1>'+(edit?'Configuration enregistrée':'Ton addon est prêt')+'</h1>'
  +(edit?'<p class="sub" style="margin:0">Les changements sont déjà actifs dans Stremio. Relance simplement la chaîne.</p>':'<p class="sub" style="margin:0">Il reste une étape : l\'installer dans Stremio.</p>')
  +(!edit&&result.link?'<ol class="how"><li>Clique sur <b>Installer dans Stremio</b> (ou copie le lien ci-dessous dans Stremio → Addons → coller l\'URL).</li><li>Confirme l\'installation dans Stremio.</li><li>Ouvre un live dans la catégorie TV et profite 🎉</li></ol>':'')
  +(result.link?'<div class="url" style="width:100%"><input type="text" id="link" readonly value="'+esc(result.link)+'"><button class="btn" id="copy">Copier</button></div><div class="acts"><a class="btn pr big" href="'+esc(result.stremio)+'">Installer dans Stremio</a></div>':'')
  +(result.cfgLink?'<div class="idbox"><span class="lab">🔑 Ton identifiant de profil</span><div class="url"><input type="text" id="idv" readonly value="'+esc(id)+'"><button class="btn" id="copyid">Copier</button></div><span class="hint">Garde-le avec ton mot de passe. Pour modifier ton profil plus tard : roue ⚙ de l\'addon dans Stremio, ou cette page → onglet <b>Se connecter</b> → identifiant + mot de passe.</span></div>':'')+'</div>';
 if(!(step===5&&result))h='<div class="eyebrow">Étape '+(step+1)+' / 6 · '+STEPS[step]+'</div>'+h; let nav='';
 if(!(step===5&&result))nav='<div class="nav"><button class="btn" id="back"'+(step?'':' disabled')+'>← Retour</button>'+(step<5?'<button class="btn pr" id="next">Continuer →</button>':'<button class="btn pr big" id="go">'+(edit?'Enregistrer':'Créer mon lien')+'</button>')+'</div>';
 return '<div class="pane">'+h+nav+'</div>';
}
function loginHtml(){
 let last=null;try{last=JSON.parse(localStorage.twprofile||'null')}catch{}
 return '<div class="pane"><h1>Se connecter à mon profil</h1><p class="sub">Retrouve ton profil pour changer tes réglages. <b>Pas besoin de réinstaller</b> l\'addon : les changements sont pris en compte tout de suite dans Stremio.</p><div class="grid">'+sessBanner()
 +'<div class="row"><label class="lab" for="lid">Identifiant du profil</label><input type="text" id="lid" placeholder="ex : Ow9Rf28HA40fExULUG44yw" autocomplete="off" spellcheck="false" value="'+esc(last&&last.id||'')+'"><span class="err" id="e-lid">Identifiant non reconnu.</span><span class="hint">'+(last&&last.pseudo?'Rempli avec le profil <b>'+esc(last.pseudo)+'</b> de cet appareil. ':'')+'C\'est le code affiché à la fin de la création de ton profil. Tu peux aussi coller ton lien de configuration ou d\'installation en entier : je retrouve le code dedans.</span></div>'
 +'<div class="row"><label class="lab" for="lpw">Mot de passe</label>'+pwField('lpw','Ton mot de passe')+'<span class="err" id="e-lpw"></span><span class="hint">Celui choisi à la création du profil. Si tu l\'as oublié, contacte l\'administrateur : il peut le réinitialiser, et tu pourras alors te connecter avec ce champ vide pour en choisir un nouveau.</span></div></div>'
 +'<div class="nav" style="justify-content:flex-end"><button class="btn pr big" id="login">Se connecter</button></div></div>';
}


const SS={get(){try{const o=JSON.parse(sessionStorage.twsess||'null');return o&&o.id&&Date.now()-o.t<600000?o:null}catch{return null}},set(i,pw,ps){try{sessionStorage.twsess=JSON.stringify({id:i,pw,pseudo:ps,t:Date.now()})}catch{}},clear(){try{sessionStorage.removeItem('twsess')}catch{}}};
const FOOT='';
function foot(){const f=$('#foot');if(f)f.innerHTML=id?'Connecté : <b>'+esc(st.pseudo)+'</b> · <button class="lnk" id="logout">Se déconnecter</button> · session gardée 10 min dans cet onglet':FOOT}
document.addEventListener('click',e=>{if(e.target.id==='logout'){SS.clear();location.href='/config'}});
const sessBanner=()=>{const o=SS.get();return o?'<div class="note ok">Session active : <b>'+esc(o.pseudo||'profil')+'</b> <button class="lnk" id="resume">Reprendre →</button></div>':''};
function welcomeHtml(){
 return '<div class="pane"><div class="eyebrow">Bienvenue</div><h1>'+esc(SITE.title)+' 👋</h1><div class="grid"><p style="color:var(--t2)">'+(SITE.text?esc(SITE.text):'Cet addon ajoute les <b>lives Twitch</b> dans Stremio. Tu choisis une chaîne en direct, elle se lance sur PC, TV ou téléphone, avec la qualité que tu veux (jusqu\'au 1440p) et <b>sans publicité</b> quand c\'est possible.')+'</p>'
 +'<div class="feat"><div class="spot"><b>📺 Dans Stremio</b>Un catalogue de lives, comme un film ou une série.</div><div class="spot"><b>🚫 Sans pub</b>Le flux est récupéré ailleurs pour éviter les écrans de pub.</div><div class="spot"><b>⚙️ À ta façon</b>Chaque personne a son profil et ses propres réglages.</div></div>'
 +'<div class="why"><b>Comment ça marche ?</b> Tu crées ton profil en 6 étapes (environ 2 minutes), tu l\'installes <b>une seule fois</b> dans Stremio, puis tu pourras toujours modifier tes réglages sans réinstaller.</div>'+(SITE.open?'':'<div class="note w">Les inscriptions sont fermées pour le moment. Si tu as déjà un profil, utilise l\'onglet <b>Se connecter</b>.</div>')+sessBanner()+'</div>'
 +'<div class="nav" style="justify-content:flex-end">'+(SITE.open?'<button class="btn pr big" id="start">Commencer →</button>':'')+'</div></div>';
}
async function enter(i,pw,r){
 id=i;curPw=pw;nopw=!!r.nopw;fresh=false;welcome=false;locked=false;Object.assign(st,r.cfg,{pseudo:r.pseudo});SS.set(id,pw,r.pseudo);
 try{localStorage.twprofile=JSON.stringify({id,pseudo:r.pseudo})}catch{}
 $('#tabs').classList.add('off');$('#mode').textContent='Modifier';$('#steps').classList.remove('off');foot();step=0;await show(body(),1);
}

async function doLogin(){

 if(c){try{Object.assign(st,unb64(c[2]),{pseudo:clean(decodeURIComponent(c[1]))});legacy=true;toast('Ancien lien reconnu : crée ton nouveau profil avec tes réglages ✓');return setTab('create')}catch{}}
 const m=raw.match(/\/u\/([A-Za-z0-9_-]{16,40})/)||raw.match(/^([A-Za-z0-9_-]{16,40})$/);

function lockHtml(msg){return '<div class="pane"><div class="lock"><div class="ico"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div><div><h1>Configuration protégée</h1><p class="sub" style="margin:0">Entre ton mot de passe pour modifier tes réglages.</p></div><div class="row"><label class="lab" for="pwo">Mot de passe</label><div class="fld"><input type="password" id="pwo" autocomplete="current-password" spellcheck="false"><button class="eye" type="button" data-eye="pwo" aria-label="Afficher">'+EYE+'</button></div><span class="err'+(msg?' show':'')+'" id="e-pwo">'+esc(msg||'')+'</span></div><button class="btn pr big" id="unlock" style="width:100%">Déverrouiller</button></div></div>';}

// transition fluide : sortie → mesure → hauteur animée → entrée
async function show(html,dir=1){
 const stage=$('#stage'),old=stage.firstElementChild;swapping=true;
 const h0=stage.offsetHeight;
 if(old){old.classList.remove('in-l','in-r','fade');old.classList.add(dir>0?'x-l':'x-r');await wait(190);old.remove()}
 stage.insertAdjacentHTML('beforeend',html);const p=stage.lastElementChild;
 p.classList.add(old?(dir>0?'in-l':'in-r'):'fade');
 if(h0){const h1=p.offsetHeight;stage.style.height=h0+'px';stage.offsetHeight;stage.style.height=h1+'px';setTimeout(()=>{stage.style.height=''},480)}
 steps();bind();swapping=false;
}

let verify=null;
const VROWS=()=>[['link','Lecture du lien','En attente…'],['srv','Connexion au serveur','En attente…'],['cfg','Lecture de ta configuration','En attente…'],['tw','Accès à Twitch','En attente…']].concat(st.relay?[['rel','Relais sans publicité','En attente…']]:[],st.tok?[['acc','Compte Twitch lié','En attente…']]:[],[['cat','Catalogues Stremio','En attente…']]);
function verifyHtml(){
 const rows=verify.rows.map((r,i)=>'<div class="vr '+r.s+'" id="vr-'+r.k+'" style="animation-delay:'+(i*.05)+'s"><span class="ix">'+String(i+1).padStart(2,'0')+'</span><span class="ic">'+(r.s==='ok'?'✓':r.s==='ko'?'✕':r.s==='warn'?'!':r.s==='run'?'<span class="sp2"></span>':'·')+'</span><div class="tx"><b>'+r.t+'</b><span>'+esc(r.d)+'</span></div><span class="tg2">'+({wait:'',run:'EN COURS',ok:'OK',warn:'ATTENTION',ko:'ÉCHEC'})[r.s]+'</span></div>').join('');
 const fin=verify.done,ko=verify.rows.some(r=>r.s==='ko'),st0=vStat();
 return '<div class="pane"><div class="eyebrow">Vérification</div><h1>Analyse de ton lien 🛰️</h1><p class="sub">On vérifie que <b>tout fonctionne</b> avant l\'installation. Ne bouge pas, ça prend quelques secondes.</p>'
  +'<div class="vf'+(st0.fin?(st0.ko?' bad':' fin'):' scan')+'" id="vf"><i class="hc a"></i><i class="hc b"></i><i class="hc c"></i><i class="hc d"></i>'
  +'<div class="vtop"><div class="vring"><svg viewBox="0 0 120 120"><defs><linearGradient id="vgr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9d5cff"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><circle class="rt" cx="60" cy="60" r="52" pathLength="100"/><circle class="rp" id="vbar" cx="60" cy="60" r="52" pathLength="100" style="stroke-dashoffset:'+(100-st0.pct)+'"/></svg><b id="vpct">'+st0.pct+'%</b></div>'
  +'<div class="vinfo"><span class="vkick" id="vcnt">SYS.DIAG // '+st0.d+'/'+st0.n+' contrôles</span><strong id="vstat">'+st0.txt+'</strong><span class="vlog" id="vlog">'+esc(st0.log)+'</span></div></div>'
  +'<div class="vlist">'+rows+'</div></div>'
  +(fin&&!ko?'<div class="why" style="margin-top:14px">✅ Tout est bon : ton lien est prêt à être installé.</div>':'')+(fin&&ko?'<div class="note w" style="margin-top:14px">Un contrôle a échoué : ton lien est enregistré mais il peut ne pas fonctionner. Relance l\'analyse ; si ça persiste, préviens le propriétaire de l\'addon.</div>':'')
  +'<div class="nav"><button class="btn" id="vback">← Retour</button><span style="flex:1"></span><button class="btn" id="vretry"'+(fin?'':' disabled')+'>Relancer 🔄</button><button class="btn pr" id="vnext"'+(fin?'':' disabled')+'>Continuer →</button></div></div>';
}
function vStat(){const R=verify.rows,n=R.length,d=R.filter(x=>x.s!=='wait'&&x.s!=='run').length,ko=R.some(x=>x.s==='ko'),wa=R.some(x=>x.s==='warn'),fin=!!verify.done,run=R.find(x=>x.s==='run');return{n,d,ko,fin,pct:fin?100:Math.round(d/n*100),txt:fin?(ko?'Problème détecté':wa?'Prêt, avec avertissements':'Tout est opérationnel'):'Analyse en cours',log:run?'> '+run.d:fin?'> diagnostic terminé':'> initialisation…'}}
function vhud(){const f=$('#vf');if(!f)return;const t=vStat();f.className='vf'+(t.fin?(t.ko?' bad':' fin'):' scan');$('#vbar').style.strokeDashoffset=100-t.pct;$('#vpct').textContent=t.pct+'%';$('#vcnt').textContent='SYS.DIAG // '+t.d+'/'+t.n+' contrôles';$('#vstat').textContent=t.txt;$('#vlog').textContent=t.log}
function vset(k,s,d){const r=verify.rows.find(x=>x.k===k);if(!r)return;r.s=s;if(d!==undefined)r.d=d;const el=$('#vr-'+k);if(el){el.className='vr '+s;el.querySelector('.ic').innerHTML=s==='ok'?'✓':s==='ko'?'✕':s==='warn'?'!':s==='run'?'<span class="sp2"></span>':'·';el.querySelector('.tx span').textContent=r.d;el.querySelector('.tg2').textContent=({wait:'',run:'EN COURS',ok:'OK',warn:'ATTENTION',ko:'ÉCHEC'})[s]}
 vhud()}
async function runVerify(){
 const v=verify={rows:VROWS().map(([k,t,d])=>({k,t,d,s:'wait'})),pct:0,done:false};
 await show(verifyHtml(),1);const alive=()=>verify===v;
 const nap=()=>wait(350);
 const link=result.link;let man=null,chk=null;
 vset('link','run','Contrôle du format…');await nap();
 try{const u=new URL(link);if(!/manifest\.json$/.test(u.pathname))throw 0;vset('link','ok','Lien reconnu, format valide.')}catch{vset('link','ko','Le lien est invalide.')}
 if(!alive())return;
 vset('srv','run','Appel du serveur…');const t0=performance.now();
 try{const r=await fetch(link,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);man=await r.json();vset('srv','ok',(man.name||'Addon')+' v'+(man.version||'?')+' répond ('+Math.round(performance.now()-t0)+' ms).')}catch(e){vset('srv','ko','Le serveur ne répond pas ('+e.message+').')}
 await nap();if(!alive())return;
 vset('cfg','run','Lecture du profil…');await nap();
 if(man&&Array.isArray(man.catalogs)){vset('cfg','ok','Profil « '+(st.pseudo||'?')+' » · qualité '+(st.cap?st.cap+'p max':'maximum')+' · '+(st.relay?'relais actifs':'flux officiel')+(st.pc?' · mode ordinateur':'')+'.')}else vset('cfg','ko','Manifeste illisible.');
 if(!alive())return;
 vset('tw','run','Interrogation de Twitch…');
 try{const r=await fetch(link.replace(/manifest\.json$/,'check'),{cache:'no-store'});chk=await r.json()}catch(e){chk=null}
 if(!alive())return;
 if(!chk)vset('tw','ko','Vérification impossible (serveur injoignable).');
 else if(chk.maint)vset('tw','warn','L\'addon est en maintenance : les lives sont suspendus.');
 else if(chk.twitch&&chk.twitch.ok)vset('tw','ok','Twitch répond ('+chk.twitch.ms+' ms)'+(chk.twitch.n?' · '+chk.twitch.n+' lives lus.':'.'));
 else vset('tw','ko','Twitch ne répond pas : '+((chk.twitch&&chk.twitch.err)||'erreur inconnue')+'.');
 await nap();if(!alive())return;
 if(st.relay){vset('rel','run','Test des relais…');await nap();
  if(!chk||!chk.relais)vset('rel','warn','Relais coupés par le propriétaire : flux officiel (avec pubs).');
  else if(chk.relais.ok&&chk.relais.sansLive)vset('rel','ok',chk.relais.total+' relais configurés (test en direct impossible : aucun live trouvé à l\'instant).');
  else if(chk.relais.ok)vset('rel','ok','Relais « '+chk.relais.nom+' » opérationnel ('+chk.relais.ms+' ms, '+chk.relais.total+' disponibles).');
  else vset('rel','warn','Aucun relais ne répond : l\'addon utilisera le flux officiel.');
  if(!alive())return}
 if(st.tok){vset('acc','run','Test de ton compte…');await nap();
  if(chk&&chk.compte&&chk.compte.ok)vset('acc','ok','Compte reconnu · qualité accordée : '+chk.compte.resolution+'.');
  else vset('acc','warn',(chk&&chk.compte&&chk.compte.err)||'Compte non vérifié : relie-le à nouveau à l\'étape Compte.');
  if(!alive())return}
 vset('cat','run','Lecture du manifeste…');await nap();
 if(man&&man.catalogs&&man.catalogs.length)vset('cat','ok',man.catalogs.map(c=>c.name.replace(/^Twitch · /,'')).join(' · '));else vset('cat','warn','Aucun catalogue : seuls les liens directs fonctionneront.');
 v.pct=100;v.done=true;await wait(300);if(!alive())return;
 await show(verifyHtml(),1);
}
async function go(n,force){
 if(swapping)return;
 n=Math.max(0,Math.min(5,n));if(n===step&&!force)return;
 if(n>step&&!validate(step))return;
 const dir=n>=step?1:-1;step=n;result=null;verify=null;
 await show(body(),dir);
 if(n>0||true)scrollTo({top:0,behavior:'smooth'});
 const f=$('#pseudo');if(step===0&&f&&!st.pseudo)f.focus({preventScroll:true});
}
function bad(i,m){const e=$('#'+i);if(e){e.classList.remove('bad');void e.offsetWidth;e.classList.add('bad');e.focus()}const er=$('#e-'+i);if(er){if(m)er.textContent=m;er.classList.add('show')}return false}
function validate(s){
 if(s!==0)return true;
 if(clean(st.pseudo).length<2)return bad('pseudo');
 if(needPw()){if(newPw.length<6)return bad('pw1');if(newPw!==newPw2)return bad('pw2')}
 if(!id&&SITE.needCode&&!code.trim())return bad('code');
 else if(newPw&&newPw.length<6)return bad('pw1');
 return true;
}
async function save(){
 if(busy)return;if(!validate(0))return go(0);
 busy=true;const g=$('#go');g.disabled=true;g.innerHTML='<span class="sp2"></span> Un instant…';
 try{
  if(persistent){
   const r=await api('/api/profile',{id,password:curPw,newPassword:newPw||undefined,pseudo:st.pseudo,cfg:opts(),code});
   if(r.bad==='code'){busy=false;await go(0,true);return bad('code',r.error)}
   if(!r.ok){if(r.persistent===false){persistent=false;busy=false;return save2()}toast(r.error||'Échec');busy=false;g.disabled=false;g.textContent=id?'Enregistrer':'Créer mon lien';return}
   if(!id)fresh=true;id=r.id;if(newPw){curPw=newPw;nopw=false}newPw=newPw2='';
   try{localStorage.twprofile=JSON.stringify({id,pseudo:st.pseudo})}catch{}SS.set(id,curPw,st.pseudo);foot();
   const o=location.origin;result={link:o+'/u/'+id+'/manifest.json',stremio:'stremio://'+location.host+'/u/'+id+'/manifest.json',cfgLink:o+'/u/'+id+'/configure'};
  }else return save2();
 }catch(e){toast('Erreur : '+e.message);busy=false;g.disabled=false;return}
 busy=false;await runVerify();scrollTo({top:0,behavior:'smooth'});
}
function save2(){const u=location.origin+'/c/'+st.pseudo+'/'+b64(opts())+'/manifest.json';result={link:u,stremio:'stremio://'+u.replace(/^https?:\/\//,'')};busy=false;runVerify()}
function bind(){
 const $$=(s,f)=>document.querySelectorAll(s).forEach(f);
 $('#vback')&&($('#vback').onclick=()=>go(5,true));$('#vretry')&&($('#vretry').onclick=()=>runVerify());$('#vnext')&&($('#vnext').onclick=async()=>{verify.ok=true;await show(body(),1)});
 $('#back')&&($('#back').onclick=()=>go(step-1));$('#next')&&($('#next').onclick=()=>go(step+1));$('#go')&&($('#go').onclick=save);
 $$('[data-t]',el=>{const t=()=>setSw(el.dataset.t,!st[el.dataset.t]);el.onclick=t;el.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();t()}}});
 $$('[data-eye]',b=>b.onclick=()=>{const i=$('#'+b.dataset.eye);i.type=i.type==='password'?'text':'password'});
 const unbad=e=>{e.target.classList.remove('bad');const er=$('#e-'+e.target.id);er&&er.classList.remove('show')};
 $$('input',i=>i.addEventListener('input',unbad));
 if($('#pseudo'))$('#pseudo').oninput=e=>{st.pseudo=clean(e.target.value);e.target.value=st.pseudo};
 if($('#device'))$('#device').oninput=e=>{st.device=e.target.value.replace(/[^\p{L}\p{N} _\-.]/gu,'').slice(0,24)};
 if($('#pw1')){$('#pw1').value=newPw;$('#pw1').oninput=e=>{newPw=e.target.value;$('#meter').className='meter s'+strength(newPw)};$('#meter').className='meter s'+strength(newPw)}
 if($('#code'))$('#code').oninput=e=>{code=e.target.value};
 if($('#pw2')){$('#pw2').value=newPw2;$('#pw2').oninput=e=>{newPw2=e.target.value}}
 if($('#fmt')){const pv=()=>{const f=SITE.fmts.find(x=>x.id===st.fmt)||SITE.fmts[0];$('#fmtDesc').textContent=f.desc;$('#fmtPrev').innerHTML=[f.auto,f.fixed].map(o=>'<div class="pv"><b>'+esc(o.name)+'</b><span>'+esc(o.title)+'</span></div>').join('')};pv();$('#fmt').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;st.fmt=b.dataset.v;$$('#fmt button',x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b)});pv()}}
 if($('#cap'))$('#cap').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;st.cap=+b.dataset.v;$$('#cap button',x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b)})};
 if($('#fixed'))$('#fixed').onchange=e=>{st.fixed=+e.target.value};
 if($('#copy'))$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#link').value)}catch{$('#link').select();document.execCommand('copy')}toast('Lien copié ✓')};
 if($('#acctNote'))acct();
 if($('#tokDel'))$('#tokDel').onclick=()=>{st.tok='';st.acct='';st.hevc=false;acct();setSw('hevc',false)};
 if($('#tokBtn'))$('#tokBtn').onclick=async()=>{const v=$('#tokIn').value.trim();if(!v)return bad('tokIn')&&toast('Colle d\'abord la valeur du cookie');const b=$('#tokBtn');b.disabled=true;b.innerHTML='<span class="sp2"></span>';
  try{const r=await api('/api/seal',{token:v});if(r.ok){st.tok=r.sealed;st.acct=r.login||'';st.hevc=true;$('#tokIn').value='';acct();setSw('hevc',true);toast('Compte lié : '+(r.login||'ok'))}else{toast(r.error||'Échec')}}catch(e){toast('Erreur : '+e.message)}
  b.disabled=false;b.textContent='Lier'};
 if($('#login'))$('#login').onclick=doLogin;
 if($('#start'))$('#start').onclick=async()=>{welcome=false;$('#steps').classList.remove('off');step=0;await show(body(),1)};
 if($('#resume'))$('#resume').onclick=resume;
 if($('#copyid'))$('#copyid').onclick=async()=>{try{await navigator.clipboard.writeText($('#idv').value)}catch{$('#idv').select();document.execCommand('copy')}toast('Identifiant copié ✓')};
 if($('#lid')&&!$('#lid').value)$('#lid').focus({preventScroll:true});else if($('#lpw'))$('#lpw').focus({preventScroll:true});
 if($('#unlock')){const u=async()=>{const p=$('#pwo').value;if(!p)return bad('pwo','Entre ton mot de passe.');const b=$('#unlock');b.disabled=true;b.innerHTML='<span class="sp2"></span>';
   try{const r=await api('/api/profile',{id,action:'open',password:p});
    if(r.ok)return enter(id,p,r);
    b.disabled=false;b.textContent='Déverrouiller';bad('pwo',r.error||'Échec')}catch(e){b.disabled=false;b.textContent='Déverrouiller';toast('Erreur : '+e.message)}};
  $('#unlock').onclick=u;$('#pwo').onkeydown=e=>{if(e.key==='Enter')u()};$('#pwo').focus({preventScroll:true})}
}

$('#steps').onclick=e=>{const b=e.target.closest('[data-s]');if(b)go(+b.dataset.s)};

(async()=>{

 }catch{}
