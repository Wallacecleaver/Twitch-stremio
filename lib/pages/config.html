<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twitch pour Stremio · Configuration</title>
<meta name="theme-color" content="#9147ff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%239147ff' d='M4 2 2 6v14h5v3h3l3-3h4l5-5V2H4zm16 11-3 3h-5l-3 3v-3H6V4h14v9zm-3-6h-2v5h2V7zm-5 0h-2v5h2V7z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#09090b;--bg3:#141417;--el:#1c1c21;--hv:#27272a;--bs:rgba(255,255,255,.07);--bd:rgba(255,255,255,.12);--bx:rgba(255,255,255,.22);--t:#fafafa;--t2:#a1a1aa;--t3:#71717a;--a:#9147ff;--ah:#772ce8;--as:rgba(145,71,255,.14);--ok:#10b981;--oks:rgba(16,185,129,.12);--wa:#f59e0b;--was:rgba(245,158,11,.1);--ko:#ef4444;--r:12px;--rl:20px;--mono:'JetBrains Mono',Consolas,monospace}
html{font-size:15px;-webkit-font-smoothing:antialiased;color-scheme:dark}
body{font-family:'Inter',-apple-system,'Segoe UI',sans-serif;background:radial-gradient(900px 500px at 50% -120px,rgba(145,71,255,.22),transparent),var(--bg);color:var(--t);min-height:100vh;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:28px 18px 60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;margin-bottom:22px}.brand svg{width:28px;height:28px;fill:var(--a)}.brand .badge{margin-left:auto;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--a);background:var(--as);padding:3px 10px;border-radius:99px}
.steps{display:flex;align-items:flex-start;margin-bottom:20px}
.sp{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;cursor:pointer;background:none;border:0;color:var(--t3);font:inherit;font-size:.72rem;font-weight:500}
.sp::before{content:'';position:absolute;top:15px;right:50%;width:100%;height:2px;background:var(--bd)}.sp:first-child::before{display:none}
.sp i{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;background:var(--el);border:2px solid var(--bd);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:.82rem;color:var(--t2);transition:.25s}
.sp.done i{background:var(--a);border-color:var(--a);color:#fff}.sp.done::before,.sp.cur::before{background:var(--a)}
.sp.cur i{border-color:var(--a);color:#fff;box-shadow:0 0 0 5px var(--as)}.sp.cur,.sp.done{color:var(--t)}
@media(max-width:520px){.sp span{display:none}}
.card{background:var(--bg3);border:1px solid var(--bs);border-radius:var(--rl);padding:26px;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card h1{font-size:1.45rem;letter-spacing:-.02em;margin-bottom:4px}.sub{color:var(--t2);margin-bottom:22px}
.grid{display:grid;gap:18px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:600px){.two{grid-template-columns:1fr}}
.row{display:grid;gap:6px}.lab{font-size:.84rem;font-weight:600}.hint{font-size:.8rem;color:var(--t3);font-weight:400}
input[type=text],input[type=password],select{width:100%;font:inherit;color:var(--t);background:var(--el);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;outline:0;transition:.15s}
input:focus,select:focus{border-color:var(--a);box-shadow:0 0 0 3px var(--as)}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}.seg button{font:inherit;font-weight:600;font-size:.9rem;color:var(--t2);background:var(--el);border:1px solid var(--bd);border-radius:var(--r);padding:12px 8px;cursor:pointer;transition:.15s}
.seg button:hover{border-color:var(--bx);color:var(--t)}.seg button.on{background:var(--as);border-color:var(--a);color:#fff}
.tg{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;background:var(--el);border:1px solid var(--bs);border-radius:var(--r)}
.tg b{display:block;font-size:.92rem}.tg span{font-size:.8rem;color:var(--t3)}
.sw{position:relative;flex:none;width:46px;height:26px;background:var(--hv);border-radius:99px;cursor:pointer;border:0;transition:.2s}.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--a)}.sw.on::after{left:23px}
.btn{font:inherit;font-weight:600;font-size:.92rem;border:1px solid var(--bd);background:var(--el);color:var(--t);border-radius:var(--r);padding:12px 20px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{border-color:var(--bx);background:var(--hv)}.btn.pr{background:var(--a);border-color:var(--a)}.btn.pr:hover{background:var(--ah)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.dg{color:#fca5a5}.btn.big{padding:14px 26px;font-size:1rem}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;padding-top:20px;border-top:1px solid var(--bs)}
.note{padding:12px 14px;border-radius:var(--r);font-size:.85rem;border:1px solid;background:var(--as);border-color:rgba(145,71,255,.28);color:#dccbff}.note.w{background:var(--was);border-color:rgba(245,158,11,.28);color:#fcd34d}.note.ok{background:var(--oks);border-color:rgba(16,185,129,.3);color:#6ee7b7}
.url{display:flex;gap:8px}.url input{font-family:var(--mono);font-size:.76rem}
.help{background:var(--el);border:1px solid var(--bs);border-radius:var(--r);padding:4px 16px}.help summary{cursor:pointer;padding:12px 0;font-weight:600;font-size:.88rem}.help ol{padding:0 0 14px 20px;color:var(--t2);font-size:.85rem;display:grid;gap:6px}
.sum{display:grid;gap:0;border:1px solid var(--bs);border-radius:var(--r);overflow:hidden}.sum div{display:flex;justify-content:space-between;gap:12px;padding:11px 16px;border-bottom:1px solid var(--bs);font-size:.88rem}.sum div:last-child{border:0}.sum span{color:var(--t3)}.sum b{text-align:right}
.done{text-align:center;display:grid;gap:14px;justify-items:center}.done .ck{width:64px;height:64px;border-radius:50%;background:var(--oks);color:var(--ok);display:grid;place-items:center;font-size:2rem}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--el);border:1px solid var(--bx);border-radius:var(--r);padding:11px 20px;opacity:0;pointer-events:none;transition:.25s;z-index:99;font-size:.9rem}.toast.show{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:var(--t3);font-size:.78rem;margin-top:22px}
a.lnk,.lnk{color:var(--a);cursor:pointer;text-decoration:underline;background:none;border:0;font:inherit}
</style>
</head>
<body>
<div class="wrap">
<div class="brand"><svg viewBox="0 0 24 24"><path d="M4 2 2 6v14h5v3h3l3-3h4l5-5V2H4zm16 11-3 3h-5l-3 3v-3H6V4h14v9zm-3-6h-2v5h2V7zm-5 0h-2v5h2V7z"/></svg>Twitch pour Stremio<span class="badge" id="mode">Configuration</span></div>
<div class="steps" id="steps"></div>
<div class="card" id="card"></div>
<footer>Ton pseudo apparaît dans le journal de l'administrateur pour retrouver tes lectures en cas de problème.</footer>
</div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const CAPS=[[0,'Maximum'],[1440,'1440p'],[1080,'1080p'],[720,'720p'],[480,'480p'],[360,'360p']];
const STEPS=['Profil','Qualité','Compte','Options','Terminer'];
const st={pseudo:'',device:'',cap:0,fps60:true,relay:true,hevc:false,tok:'',acct:'',fixed:3,audio:false,pc:false};
let step=0,id='',fresh=false,persistent=true,result=null,busy=false,legacy=false;
const clean=p=>String(p||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9_]/g,'').slice(0,20);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const b64=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2400)};
const opts=()=>({cap:st.cap,fps60:st.fps60,relay:st.relay,hevc:st.hevc,tok:st.tok,fixed:st.fixed,audio:st.audio,pc:st.pc,device:st.device});
const api=(u,b)=>fetch(u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{}).then(r=>r.json());
const sw=(k,t,d)=>'<div class="tg"><div><b>'+t+'</b><span>'+d+'</span></div><button class="sw'+(st[k]?' on':'')+'" data-t="'+k+'" aria-label="'+t+'"></button></div>';

function steps(){
 $('#steps').innerHTML=STEPS.map((n,i)=>'<button class="sp'+(i<step?' done':'')+(i===step?' cur':'')+'" data-s="'+i+'"><i>'+(i<step?'✓':i+1)+'</i><span>'+n+'</span></button>').join('');
}
function view(){
 const edit=!!id&&!fresh;let h='';
 if(step===0)h='<h1>'+(edit?'Modifier ma configuration':'Bienvenue 👋')+'</h1><p class="sub">'+(edit?'Change ce que tu veux, puis enregistre : <b>rien à réinstaller</b>, ton addon dans Stremio est mis à jour tout seul.':'Quelques étapes rapides pour créer ton addon personnel. Pas de compte, pas de mot de passe.')+'</p><div class="grid">'
  +'<div class="row"><label class="lab" for="pseudo">Ton pseudo</label><input type="text" id="pseudo" maxlength="20" placeholder="ex : christophe" autocomplete="off" spellcheck="false" value="'+esc(st.pseudo)+'"><span class="hint">Lettres, chiffres et _ (2 à 20). Il sert à retrouver tes lectures dans le journal.</span></div>'
  +'<div class="row"><label class="lab" for="device">Appareil <span class="hint">(facultatif)</span></label><input type="text" id="device" maxlength="24" placeholder="ex : PC, TV salon, téléphone" value="'+esc(st.device)+'"></div>'
  +(edit||legacy?'':'<div class="row"><button class="lnk" id="find" style="text-align:left">J\'ai déjà un lien d\'installation → le retrouver</button><div id="findRow" hidden><input type="text" id="paste" placeholder="Colle ton ancien lien (…/manifest.json)"></div></div>')+'</div>';
 if(step===1)h='<h1>Qualité de lecture</h1><p class="sub">Choisis la qualité maximale. Si ça saccade, descends à 720p ou 480p.</p><div class="grid"><div class="row"><span class="lab">Qualité maximale</span><div class="seg" id="cap">'+CAPS.map(([v,l])=>'<button data-v="'+v+'" class="'+(st.cap===v?'on':'')+'">'+l+'</button>').join('')+'</div></div>'
  +sw('fps60','Autoriser le 60 images/s','Désactivé : seulement du 30 i/s, plus léger pour un vieux PC.')
  +'<div class="row"><label class="lab" for="fixed">Qualités fixes proposées</label><select id="fixed">'+[0,1,2,3,4,5,6].map(n=>'<option value="'+n+'"'+(st.fixed===n?' selected':'')+'>'+(n===0?'Aucune (automatique seul)':n+' qualité'+(n>1?'s':''))+'</option>').join('')+'</select><span class="hint">Elles s\'ajoutent à « Twitch » (automatique) dans la liste des sources.</span></div></div>';
 if(step===2)h='<h1>Compte Twitch <span class="hint">· facultatif</span></h1><p class="sub">Twitch ne donne le <b>1440p</b> qu\'à un compte connecté. Tu peux passer cette étape.</p><div class="grid">'
  +'<div class="note'+(st.tok?' ok':'')+'">'+(st.tok?'Compte lié'+(st.acct?' : <b>'+esc(st.acct)+'</b>':'')+'.':'Aucun compte lié : le 1440p ne sera pas proposé.')+'</div>'
  +'<div class="url"><input type="password" id="tokIn" placeholder="Valeur du cookie auth-token" autocomplete="off" spellcheck="false"><button class="btn pr" id="tokBtn">Lier</button>'+(st.tok?'<button class="btn dg" id="tokDel">Retirer</button>':'')+'</div>'
  +'<details class="help"><summary>Où trouver mon auth-token ?</summary><ol><li>Sur Chrome ou Brave, ouvre twitch.tv, connecté.</li><li>Appuie sur F12, onglet « Application ».</li><li>Cookies → https://www.twitch.tv.</li><li>Copie la valeur de la ligne <b>auth-token</b> et colle-la ci-dessus.</li></ol></details>'
  +sw('hevc','Autoriser le 1440p (HEVC / AV1)','Demande les qualités au-delà du 1080p. Nécessite un compte lié et un lecteur compatible. En cas de souci, coupe-le.')
  +'<span class="hint">Le jeton est vérifié puis chiffré, jamais affiché ni stocké en clair. Il donne accès à ton compte : ne partage pas ton lien.</span></div>';
 if(step===3)h='<h1>Options</h1><p class="sub">Les réglages avancés. Les valeurs par défaut conviennent à la plupart des gens.</p><div class="grid">'
  +sw('relay','Relais sans publicité','Récupère le flux depuis une autre région pour éviter les pubs.')
  +sw('audio','Proposer « Audio seul »','Utile pour écouter en arrière-plan.')
  +sw('pc','Mode ordinateur (Stremio PC)','À activer si le lecteur du PC charge sans fin.')+'</div>';
 if(step===4&&!result){const L=[['Pseudo',st.pseudo||'—'],['Appareil',st.device||'—'],['Qualité max',st.cap?st.cap+'p':'Maximum'],['60 images/s',st.fps60?'Oui':'Non'],['Compte Twitch',st.tok?(st.acct||'Lié'):'Non'],['1440p',st.hevc?'Oui':'Non'],['Relais sans pub',st.relay?'Oui':'Non'],['Mode ordinateur',st.pc?'Oui':'Non']];
  h='<h1>'+(edit?'Tout est bon ?':'Dernière étape')+'</h1><p class="sub">Vérifie ton récapitulatif, puis '+(edit?'enregistre.':'crée ton lien.')+'</p><div class="sum">'+L.map(r=>'<div><span>'+r[0]+'</span><b>'+esc(r[1])+'</b></div>').join('')+'</div>'
  +(edit?'<div class="note ok" style="margin-top:16px">Enregistrer met à jour ton addon <b>sans réinstallation</b>.</div>':persistent?'':'<div class="note w" style="margin-top:16px">Base de données non configurée : tu obtiendras un lien classique, à réinstaller après chaque changement.</div>');}
 if(step===4&&result)h='<div class="done"><div class="ck">✓</div><h1>'+(edit?'Configuration enregistrée':'Ton addon est prêt')+'</h1>'
  +(edit?'<p class="sub">Les changements sont déjà actifs dans Stremio. Relance simplement la chaîne.</p>':'<p class="sub">Installe-le une seule fois. Pour changer un réglage plus tard : roue ⚙ de l\'addon dans Stremio, ou rouvre ton lien de configuration.</p>')
  +(result.link?'<div class="url" style="width:100%"><input type="text" id="link" readonly value="'+esc(result.link)+'"><button class="btn" id="copy">Copier</button></div><div class="acts"><a class="btn pr big" href="'+esc(result.stremio)+'">Installer dans Stremio</a></div>':'')
  +(result.cfgLink?'<div class="note" style="width:100%;text-align:left">Garde ce lien pour modifier tes réglages à tout moment :<br><a class="lnk" href="'+esc(result.cfgLink)+'">'+esc(result.cfgLink)+'</a></div>':'')+'</div>';
 let nav='';
 if(!(step===4&&result))nav='<div class="nav"><button class="btn" id="back"'+(step?'':' disabled')+'>← Retour</button>'+(step<4?'<button class="btn pr" id="next">Continuer →</button>':'<button class="btn pr big" id="go"'+(busy?' disabled':'')+'>'+(busy?'Un instant…':edit?'Enregistrer':'Créer mon lien')+'</button>')+'</div>';
 $('#card').innerHTML=h+nav;steps();bind();
}
function go(n){if(step===0&&n>0&&clean(st.pseudo).length<2){toast('Choisis d\'abord un pseudo (2 caractères minimum)');return}step=Math.max(0,Math.min(4,n));result=null;view();scrollTo({top:0,behavior:'smooth'})}
async function save(){
 if(st.pseudo.length<2)return go(0);
 busy=true;view();
 try{
  if(persistent){const r=await api('/api/profile',{id,pseudo:st.pseudo,cfg:opts()});
   if(!r.ok){if(r.persistent===false){persistent=false;busy=false;return save2()}toast(r.error||'Échec');busy=false;return view()}
   const o=location.origin;if(!id)fresh=true;id=r.id;try{localStorage.twprofile=JSON.stringify({id,pseudo:st.pseudo})}catch{}
   result={link:o+'/u/'+id+'/manifest.json',stremio:'stremio://'+location.host+'/u/'+id+'/manifest.json',cfgLink:o+'/u/'+id+'/configure'};
  }else return save2();
 }catch(e){toast('Erreur : '+e.message)}
 busy=false;view();
}
function save2(){const u=location.origin+'/c/'+st.pseudo+'/'+b64(opts())+'/manifest.json';result={link:u,stremio:'stremio://'+u.replace(/^https?:\/\//,'')};busy=false;view()}
function bind(){
 $('#back')&&($('#back').onclick=()=>go(step-1));$('#next')&&($('#next').onclick=()=>go(step+1));$('#go')&&($('#go').onclick=save);
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{st[b.dataset.t]=!st[b.dataset.t];b.classList.toggle('on')});
 if($('#pseudo'))$('#pseudo').oninput=e=>{st.pseudo=clean(e.target.value);e.target.value=st.pseudo};
 if($('#device'))$('#device').oninput=e=>{st.device=e.target.value.replace(/[^\p{L}\p{N} _\-.]/gu,'').slice(0,24)};
 if($('#cap'))$('#cap').onclick=e=>{if(e.target.dataset.v!==undefined){st.cap=+e.target.dataset.v;view()}};
 if($('#fixed'))$('#fixed').onchange=e=>{st.fixed=+e.target.value};
 if($('#copy'))$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#link').value)}catch{$('#link').select();document.execCommand('copy')}toast('Lien copié')};
 if($('#tokDel'))$('#tokDel').onclick=()=>{st.tok='';st.acct='';st.hevc=false;view()};
 if($('#tokBtn'))$('#tokBtn').onclick=async()=>{const v=$('#tokIn').value.trim();if(!v)return toast('Colle d\'abord la valeur du cookie');const b=$('#tokBtn');b.disabled=true;b.textContent='Vérification…';
  try{const r=await api('/api/seal',{token:v});if(r.ok){st.tok=r.sealed;st.acct=r.login||'';st.hevc=true;toast('Compte lié : '+(r.login||'ok'));return view()}toast(r.error||'Échec')}catch(e){toast('Erreur : '+e.message)}
  b.disabled=false;b.textContent='Lier'};
 if($('#find'))$('#find').onclick=()=>{$('#findRow').hidden=false;$('#paste').focus()};
 if($('#paste'))$('#paste').oninput=async e=>{const v=e.target.value,u=v.match(/\/u\/([A-Za-z0-9_-]{16,40})\//),c=v.match(/\/c\/([^/]+)\/([^/]+)\//);
  try{if(u){location.href='/u/'+u[1]+'/configure'}else if(c){Object.assign(st,unb64(c[2]),{pseudo:clean(decodeURIComponent(c[1]))});toast('Réglages retrouvés');view()}else toast('Lien non reconnu')}catch{toast('Lien non reconnu')}};
}
$('#steps').onclick=e=>{const b=e.target.closest('[data-s]');if(b)go(+b.dataset.s)};
(async()=>{
 const m=location.pathname.match(/\/u\/([A-Za-z0-9_-]{16,40})\/configure/),c=location.pathname.match(/\/c\/([^/]+)\/([^/]+)\/configure/);
 try{const p=await api('/api/profile'+(m?'?id='+m[1]:''));persistent=p.persistent!==false;
  if(m){if(p.ok){id=m[1];Object.assign(st,p.cfg,{pseudo:p.pseudo,acct:p.cfg.tok?'':''});$('#mode').textContent='Modifier'}else{$('#card').innerHTML='<h1>Profil introuvable</h1><p class="sub">Ce lien de configuration n\'existe pas. <a class="lnk" href="/config">Créer un nouveau lien</a></p>';return}}
  else if(c){try{Object.assign(st,unb64(c[2]),{pseudo:clean(decodeURIComponent(c[1]))});legacy=true;$('#mode').textContent='Migration'}catch{}}
  else{try{const l=JSON.parse(localStorage.twprofile||'null');if(l&&l.id&&persistent){const q=await api('/api/profile?id='+l.id);if(q.ok){location.replace('/u/'+l.id+'/configure');return}}}catch{}}
 }catch{}
 view();
})();
</script>
</body>
</html>
