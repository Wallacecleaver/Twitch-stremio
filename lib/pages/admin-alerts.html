<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/logo.png">
<title>Administration des alertes · {{NAME}}</title>
<style>
:root{color-scheme:dark;--bg2:#111115;--bg3:#18181c;--bs:#25252c;--bd:#373740;--t:#f2f0f6;--t2:#b7b2c2}
*{box-sizing:border-box}body{margin:0;background:#0c0c0f;color:var(--t);font:14px/1.5 system-ui,sans-serif}
a{color:#ceb2ff}header.top{border-bottom:1px solid var(--bs);background:#131217}
.top-inner,main{max-width:1280px;margin:auto;padding:16px clamp(14px,4vw,40px)}
.top-inner,.brand,.sh,.ctl{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.top-inner,.sh{justify-content:space-between}.brand img{width:34px;height:34px;border-radius:9px}
main{padding-block:32px}h1{font-size:clamp(1.65rem,4vw,2.3rem);line-height:1.12;margin:0 0 18px}
.sec{border:1px solid var(--bs);border-radius:14px;background:var(--bg3);margin-bottom:16px;overflow:hidden}
.sh,.sb{padding:16px 20px}.sh{border-bottom:1px solid var(--bs)}.tw{overflow-x:auto}
.btn,.pill{display:inline-flex;align-items:center;justify-content:center;color:var(--t);background:#212127;border:1px solid var(--bd);font:inherit;font-weight:650}
.btn{padding:7px 13px;border-radius:8px;text-decoration:none;cursor:pointer}.btn:hover{background:#2a2732}.btn:disabled{opacity:.55;cursor:default}.btn.pr{background:#7135d1;border-color:#8c54e8}
.pill{border:0;border-radius:20px;padding:3px 10px;font-size:.75rem}.pill.ok{background:#12332b;color:#8beaBD}.pill.wa{background:#3b2d16;color:#ffe08f}.pill.ko{background:#3d2229;color:#ffc2c2}
table{width:100%;border-collapse:collapse;font-size:.875rem}th,td{text-align:left;border-bottom:1px solid var(--bs);padding:10px 12px}th,.dim{color:var(--t2)}th{font-size:.8rem}tr:last-child td{border:0}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><img src="/logo.png" alt=""><strong>{{NAME}}</strong><span class="pill">Administrateur Alertes · {{USERNAME}}</span></div>
    <div class="ctl"><a class="btn" href="/alerte" target="_blank" rel="noopener">Ouvrir /alerte ↗</a><a class="btn" href="/admin/logout">Déconnexion</a></div>
  </div>
</header>
<main>
  <h1>Administration des alertes</h1>
  {{ALERT_USERS}}
</main>
<script>/*{{ALERT_USERS_JS}}*/
window.loadAlertUsers();
</script>
</body>
</html>
