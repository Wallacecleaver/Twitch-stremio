name = "twitchio-segments"
main = "segments.js"
compatibility_date = "2025-01-01"
workers_dev = true
# Le secret SECRET se règle avec : npx wrangler secret put SECRET   (même valeur que SECRET dans le .env de l'addon ; ADMIN_PASSWORD s'il n'y a pas de SECRET)
